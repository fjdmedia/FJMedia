<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>FJMedia — Hand-Coded vs AI — Slide 1 (Hook)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #071520;
      --gold: #c9a84c;
      --cream: #EDEAE5;
      --dim: #5a8aaa;
    }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .post {
      width: 540px;
      height: 540px;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(201,168,76,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, #0a1e2e 0%, var(--navy) 70%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .post::before, .post::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.4;
    }
    .post::before { top: 28px; left: 28px; border-width: 1px 0 0 1px; }
    .post::after { bottom: 28px; right: 28px; border-width: 0 1px 1px 0; }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 48px;
    }
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.3);
      padding: 5px 14px;
      margin-bottom: 32px;
    }
    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: var(--cream);
      line-height: 1.3;
      max-width: 400px;
      margin-bottom: 16px;
    }
    .headline em {
      color: var(--gold);
      font-style: normal;
    }
    .stat-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 56px;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 40px rgba(201,168,76,0.2);
    }
    .stat-unit {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .sub {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--cream);
      opacity: 0.7;
      letter-spacing: -0.01em;
    }
    .tag {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(201,168,76,0.35);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 2;
    }
    .swipe {
      position: absolute;
      bottom: 52px;
      right: 36px;
      font-family: 'DM Sans', sans-serif;
      font-size: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--dim);
      z-index: 2;
    }
    .swipe::after {
      content: ' \2192';
    }
  </style>
</head>
<body>
  <div class="post">
    <div class="grid"></div>
    <div class="content">
      <div class="eyebrow">Unpopular opinion</div>
      <div class="headline">AI can build your website in</div>
      <div class="stat-row">
        <div class="stat">60</div>
        <div class="stat-unit">seconds</div>
      </div>
      <div class="sub">Here's why that's a problem.</div>
    </div>
    <div class="swipe">Swipe</div>
    <div class="tag">fjmedia &nbsp;·&nbsp; winnipeg</div>
  </div>
</body>
</html>
