<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.post{width:540px;height:540px;background:#071520;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:44px 50px;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,168,76,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.03) 1px,transparent 1px);background-size:40px 40px;}
.corner{position:absolute;width:60px;height:60px;border-color:#c9a84c;border-style:solid;opacity:0.4;}
.corner.tl{top:28px;left:28px;border-width:1px 0 0 1px;}
.corner.br{bottom:28px;right:28px;border-width:0 1px 1px 0;}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;height:100%;justify-content:center;}
.logo-mark{font-family:"Space Mono",monospace;font-size:32px;color:#c9a84c;letter-spacing:-0.01em;margin-bottom:6px;}
.logo-word{font-family:"Syne",sans-serif;font-weight:800;font-size:13px;color:#EDEAE5;letter-spacing:.22em;text-transform:uppercase;margin-bottom:32px;}
.big-heading{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:22px;color:#EDEAE5;line-height:1.3;margin-bottom:10px;}
.big-heading em{color:#c9a84c;font-style:normal;}
.sub{font-family:"DM Sans",sans-serif;font-size:12px;color:rgba(237,234,229,0.5);letter-spacing:.06em;line-height:1.6;margin-bottom:28px;}
.divider{width:40px;height:1px;background:#c9a84c;opacity:0.4;margin-bottom:28px;}
.dm-box{border:1px solid rgba(201,168,76,0.35);background:rgba(201,168,76,0.06);border-radius:8px;padding:20px 32px;margin-bottom:16px;}
.dm-text{font-family:"DM Sans",sans-serif;font-size:13px;color:#EDEAE5;line-height:1.5;}
.dm-text em{color:#c9a84c;font-style:normal;font-weight:600;}
.or-line{font-family:"DM Sans",sans-serif;font-size:10px;color:rgba(237,234,229,0.3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px;}
.link{font-family:"Space Mono",monospace;font-size:13px;color:#c9a84c;letter-spacing:.02em;}
.logo{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-family:"DM Sans",sans-serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(201,168,76,0.25);z-index:2;}
.hint{margin-top:20px;font-family:sans-serif;font-size:12px;color:#444;text-align:center;}
</style></head><body>
<div style="display:flex;flex-direction:column;align-items:center;">
<div class="post">
  <div class="grid"></div>
  <div class="corner tl"></div>
  <div class="corner br"></div>
  <div class="center">
    <div class="logo-mark">{FJ}</div>
    <div class="logo-word">FJMedia</div>
    <div class="big-heading">I already built your site.<br><em>Want to see it?</em></div>
    <div class="divider"></div>
    <div class="dm-box">
      <div class="dm-text">DM us <em>"website"</em> and we'll send you<br>a free mockup of your business — built<br>in 48 hours, before you spend a dime.</div>
    </div>
    <div class="or-line">or book a 15-min call</div>
    <div class="link">fjmedia.ca</div>
  </div>
  <div class="logo">fjmedia &middot; winnipeg</div>
</div>
<p class="hint">Rendered at 1080x1080 via Playwright</p>
</div></body></html>
