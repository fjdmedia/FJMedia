<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Day 10 — Slide 1 Hook</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:  #071520;
      --gold:  #c9a84c;
      --cream: #EDEAE5;
      --dim:   rgba(201,168,76,0.35);
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .post {
      width: 540px;
      height: 540px;
      background: var(--navy);
      position: relative;
      overflow: hidden;
    }

    /* Corner brackets */
    .post::before,
    .post::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.4;
      z-index: 5;
    }
    .post::before { top: 28px; left: 28px; border-width: 1px 0 0 1px; }
    .post::after { bottom: 28px; right: 28px; border-width: 0 1px 1px 0; }

    /* Grid texture */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Noise grain overlay */
    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      z-index: 1;
    }

    /* Diagonal gold gradient atmosphere */
    .atmosphere {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.04) 0%, transparent 40%, transparent 60%, rgba(201,168,76,0.02) 100%);
      z-index: 1;
    }

    /* Massive 5 — bleeds off the right edge, overlaps everything */
    .big-five {
      position: absolute;
      right: -40px;
      top: 50%;
      transform: translateY(-55%);
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 380px;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(201,168,76,0.12);
      z-index: 2;
      user-select: none;
    }

    /* Gold glow behind the number */
    .glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 65%);
      right: -20px;
      top: 50%;
      transform: translateY(-55%);
      z-index: 1;
    }

    /* Content — left-aligned, asymmetric */
    .content {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 52px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 340px;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      font-weight: 500;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 20px;
    }

    /* Solid gold 5 that sits with the text */
    .inline-five {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 72px;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 4px;
    }

    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 26px;
      color: var(--cream);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .subline {
      margin-top: 14px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 12px;
      color: rgba(237,234,229,0.45);
      line-height: 1.6;
    }

    /* Gold accent bar */
    .accent-bar {
      width: 32px;
      height: 3px;
      background: var(--gold);
      margin-top: 20px;
      opacity: 0.7;
    }

    .tag {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 5;
    }

    .dots {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(201,168,76,0.2);
    }
    .dots span.active { background: var(--gold); }
  </style>
</head>
<body>
  <div class="post">
    <div class="grid"></div>
    <div class="noise"></div>
    <div class="atmosphere"></div>
    <div class="glow"></div>
    <div class="big-five">5</div>

    <div class="content">
      <div class="eyebrow">What you're missing</div>
      <div class="inline-five">5</div>
      <div class="headline">Things Your Website<br>Is Missing</div>
      <div class="subline">That are costing you customers<br>every single day.</div>
      <div class="accent-bar"></div>
    </div>

    <div class="dots">
      <span class="active"></span><span></span><span></span><span></span>
    </div>
    <div class="tag">fjmedia &nbsp;&middot;&nbsp; winnipeg</div>
  </div>
</body>
</html>
