<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;}

.post{
  width:540px;height:675px;
  background:#FDF6EE;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:48px 40px;
}

/* Olive top band with cookie-dough wave bottom */
.band{
  position:absolute;top:0;left:0;right:0;height:200px;
  background:#4A5E2A;
}
.band::after{
  content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;
  background:#FDF6EE;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
}

/* Blush pink circle accent behind content */
.accent-circle{
  position:absolute;top:50%;left:50%;
  width:320px;height:320px;
  background:radial-gradient(circle,rgba(242,196,206,0.25) 0%,transparent 70%);
  transform:translate(-50%,-45%);
}

/* Rose dots decoration */
.dot-row{
  position:absolute;top:168px;left:0;right:0;
  display:flex;justify-content:center;gap:8px;
}
.dot{width:5px;height:5px;border-radius:50%;background:#D4849A;opacity:0.4;}

.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;margin-top:24px;}

.eyebrow{
  font-family:"DM Sans",sans-serif;font-size:9px;font-weight:600;
  letter-spacing:.3em;text-transform:uppercase;
  color:#fff;margin-bottom:14px;
  background:#4A5E2A;padding:6px 16px;border-radius:20px;
}

.client-name{
  font-family:"Pacifico",cursive;font-size:44px;
  color:#4A5E2A;line-height:1.15;margin-bottom:4px;
}

.client-sub{
  font-family:"DM Sans",sans-serif;font-size:11px;font-weight:600;
  color:#3D2B27;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:32px;
}

.headline{
  font-family:"DM Sans",sans-serif;font-size:18px;font-weight:600;
  color:#3D2B27;line-height:1.5;margin-bottom:6px;
}
.headline em{color:#4A5E2A;font-style:normal;}

.sub-line{
  font-family:"DM Sans",sans-serif;font-size:12px;font-weight:500;
  color:#3D2B27;margin-bottom:28px;
}

.stat-row{display:flex;gap:20px;margin-bottom:24px;}

.stat{
  text-align:center;
  background:#fff;border:1px solid rgba(74,94,42,0.12);
  border-radius:12px;padding:14px 18px;min-width:100px;
}
.stat-num{
  font-family:"DM Sans",sans-serif;font-size:24px;font-weight:700;
  color:#4A5E2A;line-height:1;margin-bottom:3px;
}
.stat-label{
  font-family:"DM Sans",sans-serif;font-size:8px;font-weight:500;
  color:#5C3D35;letter-spacing:.14em;text-transform:uppercase;
}

.divider{width:40px;height:2px;background:#D4849A;opacity:0.35;margin-bottom:16px;border-radius:1px;}

.url{
  font-family:"DM Sans",sans-serif;font-size:10px;font-weight:500;
  color:#4A5E2A;letter-spacing:.06em;
}

.byline{
  position:absolute;bottom:18px;right:24px;
  font-family:"DM Sans",sans-serif;font-size:8px;font-weight:500;
  color:#5C3D35;opacity:0.3;letter-spacing:.14em;text-transform:uppercase;
}

.swipe{
  position:absolute;bottom:18px;left:0;right:0;text-align:center;
  font-family:"DM Sans",sans-serif;font-size:8px;
  color:#5C3D35;opacity:0.45;letter-spacing:.14em;text-transform:uppercase;
}
.swipe span{display:inline-block;animation:nudge 1.5s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

.hint{margin-top:16px;font-family:sans-serif;font-size:11px;color:#444;text-align:center;}
</style></head><body>
<div style="display:flex;flex-direction:column;align-items:center;">
<div class="post">
  <div class="band"></div>
  <div class="accent-circle"></div>
  <div class="dot-row">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div>
  </div>

  <div class="content">
    <div class="eyebrow">Client Reveal</div>
    <div class="client-name">Sugar & Shai</div>
    <div class="client-sub">Homemade Cookies &middot; Winnipeg, MB</div>

    <div class="headline">A full online ordering system.<br><em>Built in 5 days.</em></div>
    <div class="sub-line">She paid $0 until she saw the finished site.</div>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-num">$0</div>
        <div class="stat-label">Upfront</div>
      </div>
      <div class="stat">
        <div class="stat-num">5</div>
        <div class="stat-label">Days</div>
      </div>
      <div class="stat">
        <div class="stat-num">24/7</div>
        <div class="stat-label">Orders</div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="url">sugarandshaicookies.com</div>
  </div>

  <div class="swipe">Swipe <span>&rarr;</span></div>
  <div class="byline">By FJMedia</div>
</div>
<p class="hint">Slide 1 of 4 &mdash; 1080x1350 via Playwright</p>
</div></body></html>
