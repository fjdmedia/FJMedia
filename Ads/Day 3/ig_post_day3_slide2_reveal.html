<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>FJMedia — Day 3 Diego & Andrea Client Reveal</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .post {
      width: 540px;
      height: 540px;
      background: #F7F3EE;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px 0 32px;
    }

    /* Subtle paper texture overlay */
    .post::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 80% 20%, rgba(107,45,26,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── LEFT: Site mockup ── */
    .mockup-wrap {
      position: relative;
      width: 220px;
      flex-shrink: 0;
    }

    .mockup-card {
      width: 210px;
      background: #fff;
      box-shadow: 4px 6px 24px rgba(0,0,0,0.13), 1px 2px 6px rgba(0,0,0,0.07);
      transform: rotate(-3deg);
      overflow: hidden;
    }

    /* Browser bar */
    .browser-bar {
      background: #EBEBEB;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.r { background: #FF5F57; }
    .dot.y { background: #FEBC2E; }
    .dot.g { background: #28C840; }
    .url-bar {
      flex: 1;
      background: #fff;
      border-radius: 3px;
      height: 10px;
      margin-left: 6px;
    }

    .mockup-img {
      width: 100%;
      display: block;
      height: 250px;
      object-fit: cover;
      object-position: top center;
    }

    /* ── RIGHT: Content ── */
    .content {
      flex: 1;
      padding-left: 28px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6B2D1A;
      margin-bottom: 8px;
    }

    .script-name {
      font-family: 'Great Vibes', cursive;
      font-size: 52px;
      color: #1A0F08;
      line-height: 1;
      margin-bottom: 4px;
    }

    .event-type {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #1A0F08;
      margin-bottom: 3px;
    }

    .event-meta {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      color: #7A6A5A;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: #6B2D1A;
      opacity: 0.4;
      margin-bottom: 16px;
    }

    .section-label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #7A6A5A;
      margin-bottom: 10px;
    }

    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 20px;
    }
    .bullets li {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      color: #3D2B1A;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      line-height: 1.4;
    }
    .bullets li::before {
      content: '▪';
      color: #6B2D1A;
      font-size: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .price-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7A6A5A;
    }
    .price-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 300;
      color: #1A0F08;
      letter-spacing: -0.01em;
    }

    /* BY FJMEDIA */
    .byline {
      position: absolute;
      bottom: 20px;
      right: 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(107,45,26,0.35);
    }

    .hint {
      margin-top: 20px;
      font-family: sans-serif;
      font-size: 12px;
      color: #444;
      text-align: center;
    }
  </style>
</head>
