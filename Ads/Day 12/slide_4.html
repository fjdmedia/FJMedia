<!DOCTYPE html>
<!-- © 2026 FJMedia. All rights reserved. -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="author" content="FJMedia">
  <meta name="designer" content="FJMedia — fjmedia.ca">
  <title>Day 12 — Slide 4 CTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:  #071520;
      --gold:  #c9a84c;
      --cream: #EDEAE5;
      --dim:   rgba(201,168,76,0.35);
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .post {
      width: 540px;
      height: 540px;
      background: var(--navy);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post::before,
    .post::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.4;
      z-index: 5;
    }
    .post::before { top: 28px; left: 28px; border-width: 1px 0 0 1px; }
    .post::after { bottom: 28px; right: 28px; border-width: 0 1px 1px 0; }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      z-index: 1;
    }

    .glow {
      position: absolute;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(201,168,76,0.11) 0%, rgba(201,168,76,0.03) 40%, transparent 70%);
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(201,168,76,0.04) 70%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 44px;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--gold);
      opacity: 0.7;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 14px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: var(--cream);
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }
    .headline em {
      color: var(--gold);
      font-style: normal;
    }

    .cta-box {
      border: 1.5px solid var(--gold);
      padding: 20px 44px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      margin-bottom: 22px;
    }
    .cta-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(201,168,76,0.05);
    }

    .cta-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      font-weight: 500;
      color: rgba(237,234,229,0.45);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      position: relative;
    }
    .cta-keyword {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 26px;
      color: var(--gold);
      letter-spacing: 0.02em;
      position: relative;
    }

    .promise-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 18px;
    }
    .promise {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: var(--cream);
      letter-spacing: -0.005em;
    }
    .promise em {
      color: var(--gold);
      font-style: normal;
    }

    .rule-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .rule-row .line {
      width: 22px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }
    .rule-row .center {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: rgba(201,168,76,0.6);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .url {
      font-family: 'Space Mono', monospace;
      font-weight: 400;
      font-size: 11px;
      color: rgba(201,168,76,0.5);
      letter-spacing: 0.08em;
    }

    .tag {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 5;
    }

    .dots {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(201,168,76,0.2);
    }
    .dots span.active { background: var(--gold); }
  </style>
</head>
<body>
  <div class="post">
    <div class="grid"></div>
    <div class="noise"></div>
    <div class="glow"></div>
    <div class="atmosphere"></div>

    <div class="content">
      <div class="eyebrow">04 · Your move</div>

      <div class="headline">Stop running<br>your business on<br>borrowed ground.</div>

      <div class="cta-box">
        <div class="cta-label">DM us the word</div>
        <div class="cta-keyword">"FREE Webby"</div>
      </div>

      <div class="promise-stack">
        <div class="promise">Built in <em>48 hours.</em></div>
        <div class="promise"><em>Free</em> until you love it.</div>
      </div>

      <div class="rule-row">
        <span class="line"></span>
        <span class="center">Web Partner for Local Businesses</span>
        <span class="line"></span>
      </div>

      <div class="url">fjmedia.ca</div>
    </div>

    <div class="dots">
      <span></span><span></span><span></span><span class="active"></span>
    </div>
    <div class="tag">fjmedia &nbsp;&middot;&nbsp; winnipeg</div>
  </div>
</body>
</html>
