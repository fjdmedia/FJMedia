<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>FJMedia — Day 14 Offer Post</title>
  <!-- Design System: Agency Offer | Fonts: Plus Jakarta Sans + Syne + Space Mono + DM Sans | Palette: #071520 #c9a84c #EDEAE5 -->
  <!-- Spatial: stat number dominates center, accent lines break the stack | Texture: radial vignette + grid | Memorable: the "48" is the first and last thing you see -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:  #071520;
      --gold:  #c9a84c;
      --cream: #EDEAE5;
      --dim:   #5a8aaa; /* bumped from #3a6080 — passes WCAG AA on navy */
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .post {
      width: 540px;
      height: 540px;
      /* FIX #6: radial vignette for depth — darker edges, subtle lift in center */
      background:
        radial-gradient(ellipse at 50% 40%, rgba(201,168,76,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, #0a1e2e 0%, var(--navy) 70%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Corner accents */
    .post::before,
    .post::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.4;
    }
    .post::before { top: 28px; left: 28px; border-width: 1px 0 0 1px; }
    .post::after { bottom: 28px; right: 28px; border-width: 0 1px 1px 0; }

    /* Grid */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* FIX #2: focused glow behind the "48" — bigger, warmer */
    .glow {
      position: absolute;
      width: 300px;
      height: 200px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.10) 0%, rgba(201,168,76,0.03) 50%, transparent 80%);
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 40px;
    }

    /* FIX #5: {FJ} logo mark — top center, subtle */
    .logo-mark {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      color: var(--gold);
      opacity: 0.35;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    /* FIX #7: Scarcity eyebrow — pill badge with border */
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.3);
      padding: 5px 16px;
      margin-bottom: 24px;
    }

    /* Main headline */
    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 26px;
      color: var(--cream);
      line-height: 1.25;
      letter-spacing: -0.01em;
      max-width: 420px;
      margin-bottom: 4px;
    }

    /* FIX #2: "48" dominates — 80px with gold glow */
    .stat {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 80px;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 2px;
      text-shadow:
        0 0 40px rgba(201,168,76,0.25),
        0 0 80px rgba(201,168,76,0.10);
    }

    /* FIX #1: --dim bumped for WCAG */
    .stat-unit {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* FIX #4: Accent lines flanking divider — spatial break */
    .divider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .divider-line {
      width: 40px;
      height: 1px;
      background: var(--gold);
      opacity: 0.25;
    }
    .divider-diamond {
      width: 5px;
      height: 5px;
      background: var(--gold);
      opacity: 0.5;
      transform: rotate(45deg);
    }

    /* Risk reversal */
    .risk {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 15px;
      color: var(--cream);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }
    .risk em {
      color: var(--gold);
      font-style: normal;
    }

    .risk-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 400;
      color: var(--dim);
      letter-spacing: 0.04em;
      margin-bottom: 24px;
    }

    /* FIX #3: CTA box — stronger border + subtle gold fill */
    .cta-box {
      border: 1px solid rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.06);
      padding: 14px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .cta-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--dim);
    }
    .cta-keyword {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--gold);
    }

    /* Bottom tag */
    .tag {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(201,168,76,0.35);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="post">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="content">
      <div class="logo-mark">{FJ}</div>

      <div class="eyebrow">Limited spots each month</div>

      <div class="headline">Your website, built in</div>

      <div class="stat">48</div>
      <div class="stat-unit">hours</div>

      <div class="divider-row">
        <div class="divider-line"></div>
        <div class="divider-diamond"></div>
        <div class="divider-line"></div>
      </div>

      <div class="risk"><em>Free</em> until you love it.</div>
      <div class="risk-sub">Custom design · Mobile-first · Launched live.</div>

      <div class="cta-box">
        <span class="cta-label">DM us the words</span>
        <span class="cta-keyword">"FREE Webby"</span>
      </div>
    </div>

    <div class="tag">fjmedia &nbsp;·&nbsp; winnipeg</div>
  </div>

</body>
</html>
