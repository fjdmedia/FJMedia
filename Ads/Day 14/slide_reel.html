<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>FJMedia — Day 14 Offer Reel</title>
  <!-- Design System: Agency Offer | Animated version for video capture -->
  <!-- Timeline: logo 0s → eyebrow 0.4s → headline 0.8s → 48 slam 1.4s → hours 2.0s → divider 2.4s → risk 2.8s → sub 3.2s → CTA 3.6s → tag 4.2s → hold to 6s -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:  #071520;
      --gold:  #c9a84c;
      --cream: #EDEAE5;
      --dim:   #5a8aaa;
    }

    body {
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .post {
      width: 1080px;
      height: 1080px;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(201,168,76,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, #0a1e2e 0%, var(--navy) 70%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Corner accents — fade in at 0s */
    .post::before,
    .post::after {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0;
      animation: cornerIn 0.6s ease-out 0s forwards;
    }
    .post::before { top: 56px; left: 56px; border-width: 1px 0 0 1px; }
    .post::after { bottom: 56px; right: 56px; border-width: 0 1px 1px 0; }

    /* Grid — instant */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    /* Glow — pulses in with the 48 */
    .glow {
      position: absolute;
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.12) 0%, rgba(201,168,76,0.03) 50%, transparent 80%);
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 0;
      animation: glowPulse 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 80px;
    }

    /* ── ANIMATION KEYFRAMES ── */

    @keyframes cornerIn {
      from { opacity: 0; }
      to { opacity: 0.4; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slamIn {
      0% { opacity: 0; transform: scale(2.5); filter: blur(8px); }
      60% { opacity: 1; transform: scale(0.95); filter: blur(0); }
      80% { transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes glowPulse {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes drawLine {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes diamondSpin {
      from { opacity: 0; transform: rotate(0deg) scale(0); }
      to { opacity: 0.5; transform: rotate(45deg) scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes ctaReveal {
      from { opacity: 0; transform: translateY(20px) scale(0.95); border-color: transparent; background: transparent; }
      to { opacity: 1; transform: translateY(0) scale(1); border-color: rgba(201,168,76,0.5); background: rgba(201,168,76,0.06); }
    }

    /* ── ELEMENTS WITH ANIMATION DELAYS ── */

    /* {FJ} logo — 0s */
    .logo-mark {
      font-family: 'Space Mono', monospace;
      font-size: 32px;
      color: var(--gold);
      opacity: 0;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
      animation: fadeUp 0.5s ease-out 0s forwards;
    }

    /* Scarcity pill — 0.4s */
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.3);
      padding: 10px 32px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.4s forwards;
    }

    /* Headline — 0.8s */
    .headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 52px;
      color: var(--cream);
      line-height: 1.25;
      letter-spacing: -0.01em;
      max-width: 840px;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.8s forwards;
    }

    /* 48 SLAM — 1.4s (the hero moment) */
    .stat {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 160px;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 4px;
      text-shadow:
        0 0 60px rgba(201,168,76,0.3),
        0 0 120px rgba(201,168,76,0.12);
      opacity: 0;
      animation: slamIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
    }

    /* HOURS — 2.0s */
    .stat-unit {
      font-family: 'Space Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.4s ease-out 2.0s forwards;
    }

    /* Divider row — 2.4s */
    .divider-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
    }
    .divider-line {
      width: 80px;
      height: 1px;
      background: var(--gold);
      opacity: 0.25;
      transform: scaleX(0);
      animation: drawLine 0.4s ease-out 2.4s forwards;
    }
    .divider-diamond {
      width: 10px;
      height: 10px;
      background: var(--gold);
      opacity: 0;
      transform: rotate(0deg) scale(0);
      animation: diamondSpin 0.4s ease-out 2.4s forwards;
    }

    /* Risk reversal — 2.8s */
    .risk {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 30px;
      color: var(--cream);
      letter-spacing: -0.01em;
      margin-bottom: 12px;
      opacity: 0;
      animation: slideUp 0.5s ease-out 2.8s forwards;
    }
    .risk em {
      color: var(--gold);
      font-style: normal;
    }

    /* Sub — 3.2s */
    .risk-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--dim);
      letter-spacing: 0.04em;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.4s ease-out 3.2s forwards;
    }

    /* CTA box — 3.6s */
    .cta-box {
      border: 1px solid transparent;
      background: transparent;
      padding: 28px 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: ctaReveal 0.6s ease-out 3.6s forwards;
    }
    .cta-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--dim);
    }
    .cta-keyword {
      font-family: 'Space Mono', monospace;
      font-size: 40px;
      font-weight: 700;
      color: var(--gold);
    }

    /* Bottom tag — 4.2s */
    .tag {
      position: absolute;
      bottom: 64px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      color: rgba(201,168,76,0.35);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 2;
      opacity: 0;
      animation: fadeUp 0.4s ease-out 4.2s forwards;
    }
  </style>
</head>
<body>

  <div class="post">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="content">
      <div class="logo-mark">{FJ}</div>
      <div class="eyebrow">Limited spots each month</div>
      <div class="headline">Your website, built in</div>
      <div class="stat">48</div>
      <div class="stat-unit">hours</div>

      <div class="divider-row">
        <div class="divider-line"></div>
        <div class="divider-diamond"></div>
        <div class="divider-line"></div>
      </div>

      <div class="risk"><em>Free</em> until you love it.</div>
      <div class="risk-sub">You don't pay a cent until the site is live and you're happy.</div>

      <div class="cta-box">
        <span class="cta-label">DM us the words</span>
        <span class="cta-keyword">"FREE Webby"</span>
      </div>
    </div>

    <div class="tag">fjmedia &nbsp;·&nbsp; winnipeg</div>
  </div>

</body>
</html>
