<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Sketch · FJMedia Tools</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sketch.css" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <!-- ============ GATE OVERLAY ============ -->
  <div id="unlock-overlay" class="gate">
    <form id="unlock-form" class="gate-card">
      <div class="gate-eyebrow">FJMedia Tools</div>
      <h1 class="gate-h">Sketch</h1>
      <p class="gate-sub">Enter access code to continue.</p>
      <input id="unlock-pw" type="password" inputmode="numeric" autocomplete="off" placeholder="Access code" required />
      <button id="unlock-btn" type="submit">Unlock →</button>
      <div id="unlock-err" class="gate-err"></div>
    </form>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app" hidden>
    <nav class="fj-nav">
      <a class="fj-logo" href="/fjmedia-tools/">
        <span class="bk">{</span><span class="fj">FJ</span><span class="bk">}</span><span class="media">Sketch</span>
      </a>
      <div class="right">
        <span class="page-label">Layout Sketch</span>
        <a class="back" href="/fjmedia-tools/">← Tools</a>
      </div>
    </nav>

    <div id="topbar"></div>

    <div class="workspace">
      <aside id="sidebar"></aside>
      <main id="canvas"></main>
    </div>
  </div>

  <!-- ============ GATE SCRIPT ============ -->
  <script>
    (function() {
      const EXPECTED = '61697e084834fbb2cf9ceebd945b42bdb9cd7cee96e0eaeb3df2232ccc95a3f0';
      const overlay = document.getElementById('unlock-overlay');
      const app = document.getElementById('app');
      const form = document.getElementById('unlock-form');
      const pwEl = document.getElementById('unlock-pw');
      const btn = document.getElementById('unlock-btn');
      const err = document.getElementById('unlock-err');

      async function sha256Hex(msg) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      function isUnlocked() {
        try { return (sessionStorage.getItem('fjtools_k') || localStorage.getItem('fjtools_k')) === EXPECTED; }
        catch(_) { return false; }
      }
      function grantAccess() {
        overlay.hidden = true;
        app.hidden = false;
        if (!window.__sketch_loaded) {
          window.__sketch_loaded = true;
          const s = document.createElement('script');
          s.type = 'module';
          s.src = 'js/app.js';
          document.body.appendChild(s);
        }
      }

      if (isUnlocked()) { grantAccess(); return; }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = 'Checking…';
        err.textContent = '';
        try {
          await new Promise(r => setTimeout(r, 200));
          const trimmed = pwEl.value.trim();
          const h = await sha256Hex(trimmed);
          if (h !== EXPECTED) {
            err.textContent = 'Wrong code.';
            pwEl.value = '';
            pwEl.focus();
            btn.disabled = false;
            btn.textContent = 'Unlock →';
            return;
          }
          try {
            sessionStorage.setItem('fjtools_k', h);
            localStorage.setItem('fjtools_k', h);
          } catch(_) {}
          grantAccess();
        } catch (ex) {
          err.textContent = 'Error: ' + (ex && ex.message ? ex.message : 'unknown');
          btn.disabled = false;
          btn.textContent = 'Unlock →';
        }
      });
    })();
  </script>
</body>
</html>
